<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="MF Radio is a retro-styled, shuffle-only web jukebox with 102 tracks, keyboard controls and seamless transitions." />
<meta name="theme-color" content="#0e0a14" />
<meta name="color-scheme" content="dark" />
<meta property="og:title" content="MF Radio" />
<meta property="og:description" content="Listen to 102 shuffled tracks in a retro web jukebox." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="en_US" />
<title>MF Radio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>" />
<style>
  @font-face{
    font-family:"MF Display";
    src:url("assets/fonts/Anton-Regular.ttf") format("truetype");
    font-style:normal;
    font-weight:400;
    font-display:swap;
  }
  @font-face{
    font-family:"MF Mono";
    src:url("assets/fonts/RobotoMono-Variable.ttf") format("truetype");
    font-style:normal;
    font-weight:100 900;
    font-display:swap;
  }
  :root{
    --wood-hi:#7a4a2a; --wood:#552f18; --wood-lo:#3a1e0e;
    --chrome-1:#f4f6f8; --chrome-2:#9aa4ad; --chrome-3:#5c666f;
    --neon:#ff4fd8; --neon-soft:rgba(255,79,216,.55);
    --led-amber:#ffb02e; --led-green:#3dff8b; --led-red:#ff4040;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"MF Mono", monospace;
    background:
      radial-gradient(120% 90% at 50% 18%, #1b1322 0%, #0e0a14 45%, #060409 100%);
    color:#e9eef5;
    min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center;
    padding: 28px 14px 40px;
    overflow-x:hidden;
  }
  /* checkered floor */
  body::before{
    content:""; position:fixed; left:0; right:0; bottom:0; height:34vh; z-index:0;
    background:
      repeating-conic-gradient(#141019 0% 25%, #0a070d 0% 50%);
    background-size: 84px 84px;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent);
            mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent);
    pointer-events:none;
  }

  .scene{
    position:relative; z-index:1; display:flex; flex-direction:column; align-items:center;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }

  @media (min-height:950px){ body{ align-items:center; } }

  /* ================= CABINET ================= */
  .cabinet{
    position:relative;
    width:min(440px, 94vw);
    border-radius: 34px 34px 14px 14px / 90px 90px 14px 14px;
    background:
      repeating-linear-gradient(94deg,
        rgba(0,0,0,.16) 0 3px, rgba(255,255,255,.05) 3px 6px,
        rgba(0,0,0,.10) 6px 11px, rgba(0,0,0,.20) 11px 15px),
      linear-gradient(180deg, var(--wood-hi) 0%, var(--wood) 40%, var(--wood-lo) 100%);
    border: 3px solid #2a150a;
    box-shadow:
      0 0 0 3px #c7ccd2,
      0 0 0 6px #4d565e,
      0 30px 60px rgba(0,0,0,.75),
      0 0 90px rgba(255,79,216,.10);
    padding: 18px 18px 14px;
    filter: drop-shadow(0 0 34px rgba(255,79,216,.12));
  }
  /* floor shadow */
  .cabinet::after{
    content:""; position:absolute; left:8%; right:8%; bottom:-26px; height:34px;
    background: radial-gradient(50% 100% at 50% 0%, rgba(0,0,0,.7), transparent 70%);
    z-index:-1;
  }

  /* ================= ARCHED GLASS ================= */
  .arch{
    position:relative;
    border-radius: 12px;
    overflow:hidden;
    background:
      radial-gradient(90% 55% at 50% 0%, rgba(255,190,110,.30), transparent 60%),
      radial-gradient(120% 90% at 50% 30%, #171020 0%, #0b0712 55%, #060309 100%);
    border: 4px solid;
    border-color: var(--chrome-1) var(--chrome-3) var(--chrome-2) var(--chrome-1);
    box-shadow: inset 0 0 34px rgba(0,0,0,.9), 0 2px 0 rgba(255,255,255,.15);
    padding: 26px 16px 18px;
  }
  /* warm spotlight sweep */
  .arch::before{
    content:""; position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.07) 46%, rgba(255,255,255,.02) 54%, transparent 70%);
    pointer-events:none;
  }

  .neon-sign{
    text-align:center;
    font-family:"MF Display", sans-serif;
    font-size: clamp(34px, 11vw, 46px);
    letter-spacing: .14em;
    color:#fff0fb;
    text-shadow:
      0 0 6px  #fff,
      0 0 14px var(--neon),
      0 0 30px var(--neon),
      0 0 60px var(--neon-soft),
      0 0 90px var(--neon-soft);
    user-select:none;
    animation: neonFlicker 6s infinite;
    margin-bottom: 14px;
  }
  @keyframes neonFlicker{
    0%,100%{ opacity:1; } 92%{ opacity:1; } 93%{ opacity:.55; } 94%{ opacity:1; }
    96%{ opacity:.75; } 97%{ opacity:1; }
  }

  /* ---------- record + tonearm ---------- */
  .record-stage{
    position:relative;
    width:76%; margin: 4px auto 0;
    aspect-ratio: 1/1;
  }
  .record{
    position:absolute; inset:9%; border-radius:50%;
    background:
      radial-gradient(circle at 34% 30%, rgba(255,255,255,.24), transparent 43%),
      repeating-radial-gradient(circle at 50% 50%,
        #15151a 0 2px, #292930 2px 4px, #121217 4px 6px);
    box-shadow: 0 0 28px rgba(0,0,0,.72), inset 0 0 36px rgba(0,0,0,.72);
    animation: spin 1.8s linear infinite;
    animation-play-state: paused;
  }
  .cabinet.is-playing .record{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .record .label{
    position:absolute; inset:33%; border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 45%),
      linear-gradient(160deg, #ff5fd0 0%, #b0147f 55%, #6d0b4c 100%);
    box-shadow: inset 0 0 12px rgba(0,0,0,.55), 0 0 0 3px #1a0a12;
    display:flex; align-items:center; justify-content:center;
  }
  .record .label-copy{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px;
  }
  .record .label b{
    font-family:"MF Display", sans-serif;
    font-size: clamp(16px, 5vw, 22px);
    letter-spacing:.12em; color:#fff3fa;
    text-shadow: 0 0 8px rgba(255,255,255,.8);
    line-height:.8;
    transform:translateY(-3px);
  }
  .record-track{
    font-family:"MF Mono", monospace; font-size:10px; font-weight:700;
    letter-spacing:.16em; color:#fff3fa;
    text-shadow:0 0 6px rgba(255,255,255,.75);
  }
  .record .label::after{
    content:""; position:absolute; left:50%; top:50%; width:9%; height:9%;
    transform:translate(-50%,-50%); border-radius:50%;
    background:#0b0709; box-shadow: 0 0 0 2px #3d2a33;
  }

  .tonearm{
    --arm-rot:-24deg;
    position:absolute; top:4%; right:2%;
    width:14%; height:14%;
    transform-origin: 50% 50%;
    transform: rotate(var(--arm-rot));
    transition: transform .6s cubic-bezier(.55,0,.25,1);
    z-index:3;
    pointer-events:none;
  }
  .cabinet.has-track .tonearm{ --arm-rot:14deg; }
  .tonearm.tracking{ transition:none; }
  .tonearm .pivot{
    position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--chrome-1), var(--chrome-2) 55%, var(--chrome-3));
    box-shadow: 0 2px 6px rgba(0,0,0,.6), inset 0 -2px 4px rgba(0,0,0,.4);
  }
  .tonearm .rod{
    position:absolute; left:50%; top:50%;
    width:5px; height:310%;
    transform: translate(-50%,0);
    border-radius:4px;
    background: linear-gradient(90deg, var(--chrome-3), var(--chrome-1) 45%, var(--chrome-2));
    box-shadow: 0 0 6px rgba(0,0,0,.5);
  }
  .tonearm .head{
    position:absolute; left:50%; top:308%;
    width:15px; height:24px; transform: translate(-50%,0) rotate(18deg);
    border-radius: 4px 4px 7px 7px;
    background: linear-gradient(160deg, var(--chrome-1), var(--chrome-3));
    box-shadow: 0 2px 5px rgba(0,0,0,.6);
  }

  /* ================= TRACK DISPLAY ================= */
  .marquee{
    margin-top: 16px;
    border-radius: 12px;
    background: linear-gradient(180deg, #050505, #101010 60%, #070707);
    border: 3px solid;
    border-color: var(--chrome-2) var(--chrome-3) var(--chrome-1) var(--chrome-2);
    box-shadow: inset 0 2px 14px rgba(0,0,0,.95);
    padding: 13px 12px 12px;
  }
  .led-row{
    display:flex; align-items:center; justify-content:center;
  }
  .digits{ display:flex; justify-content:center; gap:7px; }
  .digit{
    width:48px; height:58px; display:flex; align-items:center; justify-content:center;
    background:#0a0602; border:1px solid #38230b; border-radius:7px;
    font-family:"MF Mono", monospace; font-weight:700; font-size:40px;
    color:var(--led-amber);
    text-shadow: 0 0 8px rgba(255,176,46,.95), 0 0 20px rgba(255,120,20,.55);
    box-shadow: inset 0 0 14px rgba(0,0,0,.95), 0 0 8px rgba(255,176,46,.05);
  }
  .digit.dim{ color:rgba(255,176,46,.18); text-shadow:none; }
  /* ================= CONTROL PANEL ================= */
  .panel{
    position:relative;
    margin-top: 14px;
    border-radius: 12px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #d7dde2, #aab3ba 45%, #8b959d);
    border: 2px solid #525c64;
    box-shadow: inset 0 2px 3px rgba(255,255,255,.7), inset 0 -6px 12px rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.4);
    padding: 14px 14px 16px;
    display:grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 12px 14px;
    align-items:center;
  }
  .screw{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f2f5f7, #7b848c 60%, #4a525a);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,.5);
  }
  .screw::after{
    content:""; position:absolute; left:15%; right:15%; top:46%; height:1.5px;
    background:#3a424a; transform: rotate(38deg);
  }
  .screw.tl{ top:6px; left:6px; } .screw.tr{ top:6px; right:6px; }
  .screw.bl{ bottom:6px; left:6px; } .screw.br{ bottom:6px; right:6px; }

  .vu-box{
    grid-column:1 / 2; grid-row:1 / 2;
    background:#071007;
    border-radius:8px; border:2px solid #4a525a;
    box-shadow: inset 0 0 12px rgba(0,0,0,.9);
    padding:6px 8px 4px;
  }
  .vu-box canvas{ display:block; width:100%; height:42px; }
  .vu-box .vu-label{
    font-family:"MF Mono", monospace; font-size:9px; font-weight:700;
    letter-spacing:.3em; color:#5f7a68; text-align:center; margin-top:2px;
  }

  .knob-col{
    grid-column:2 / 3; grid-row:1 / 3;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .knob-wrap{ position:relative; padding-inline:12px; }
  .knob{
    --rot:-135deg;
    position:relative; width:74px; height:74px; border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, #fff, #cfd6db 30%, #8f99a1 62%, #59636b);
    border:2px solid #39424a;
    box-shadow: 0 5px 12px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.8), inset 0 -6px 10px rgba(0,0,0,.35);
    cursor: ns-resize; touch-action:none;
    user-select:none;
  }
  .knob .cap{
    position:absolute; inset:9px; border-radius:50%;
    background:
      conic-gradient(from 0deg, #6a747c, #cdd5da 25%, #6a747c 50%, #cdd5da 75%, #6a747c);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.6), inset 0 -4px 8px rgba(0,0,0,.4);
    transform: rotate(var(--rot));
    transition: transform .08s linear;
  }
  .knob .pointer{
    position:absolute; left:50%; top:5px; width:4px; height:16px;
    transform: translateX(-50%);
    border-radius:3px; background:#202830;
    box-shadow: 0 0 3px rgba(0,0,0,.5);
  }
  .knob .tick{
    position:absolute; inset:-7px; border-radius:50%;
    pointer-events:none;
  }
  .knob .tick-mark{
    position:absolute; inset:0;
    transform:rotate(var(--tick-rot));
  }
  .knob .tick-mark::after{
    content:""; position:absolute; left:50%; top:1px;
    width:1.5px; height:4px; transform:translateX(-50%);
    border-radius:2px; background:rgba(0,0,0,.48);
  }
  .knob .tick-mark.major::after{
    top:0; width:2px; height:7px; background:rgba(0,0,0,.68);
  }
  .knob-label{
    font-family:"MF Mono", monospace; font-size:9px; font-weight:700;
    letter-spacing:.28em; color:#39424a;
  }
  .knob-scale{
    position:absolute; bottom:3px;
    font-family:"MF Mono", monospace; font-size:10px; font-weight:700;
    color:#303840;
  }
  .knob-scale.min{ left:4px; }
  .knob-scale.max{ right:-1px; }
  .knob-scale.mid{
    top:-14px; bottom:auto; left:50%;
    transform:translateX(-50%);
    font-size:9px;
  }
  .broadcast-led{
    min-width:88px; margin-top:11px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-family:"MF Mono", monospace; font-size:9px; font-weight:700;
    letter-spacing:.12em; color:#23282d;
    text-shadow:none;
  }
  .broadcast-led::before{
    content:""; width:8px; height:8px; flex:0 0 auto; border-radius:50%;
    background:#451313; box-shadow:inset 0 0 3px rgba(0,0,0,.8);
  }
  .broadcast-led.on{
    color:#23282d;
    text-shadow:none;
  }
  .broadcast-led.on::before{
    background:#ff3030;
    box-shadow:0 0 7px #ff3030, 0 0 14px rgba(255,35,35,.65);
    animation:broadcastBlink 1.1s steps(2,end) infinite;
  }
  @keyframes broadcastBlink{ 50%{ opacity:.55; } }

  .btn-row{
    grid-column:1 / 2; grid-row:2 / 3;
    display:flex; gap:14px; align-items:center; justify-content:center;
  }
  .pbtn{
    --btn-hi:#fff; --btn-mid:#d94b4b; --btn-lo:#8c1616;
    position:relative;
    width:64px; height:64px; border-radius:50%;
    border:2px solid #2c3339;
    background: radial-gradient(circle at 32% 28%, var(--btn-hi), var(--btn-mid) 42%, var(--btn-lo) 78%, #5e0d0d);
    box-shadow: 0 6px 12px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.7), inset 0 -8px 12px rgba(0,0,0,.45);
    color:#fff; cursor:pointer;
    font-family:"MF Mono", monospace; font-weight:700; font-size:11px; letter-spacing:.1em;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    transition: transform .05s ease, box-shadow .05s ease;
  }
  .pbtn .glyph{ font-size:20px; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .pbtn:active{ transform: translateY(3px); box-shadow: 0 2px 5px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.6); }
  .pbtn.amber{ --btn-mid:#e8a52e; --btn-lo:#8a5a0d; --btn-hi:#ffe9c0; }
  .pbtn:focus-visible, .knob:focus-visible{
    outline:3px solid #fff; outline-offset:4px;
  }

  /* ================= SPEAKER ================= */
  .speaker{
    position:relative;
    margin-top: 14px;
    height:86px;
    border-radius: 12px;
    background:linear-gradient(180deg, #2b241a, #1d1811 60%, #141009);
    border: 2px solid #0c0906;
    box-shadow: inset 0 2px 12px rgba(0,0,0,.9), inset 0 0 32px rgba(255,176,46,.035);
    overflow:hidden;
  }
  .speaker::after{
    content:""; position:absolute; inset:0;
    background:radial-gradient(circle, rgba(210,195,170,.17) 0 1px, rgba(0,0,0,.72) 1.5px 2.5px, transparent 3px);
    background-size:8px 8px;
    box-shadow:inset 0 0 18px rgba(0,0,0,.85);
  }

  .hint{
    margin-top: 18px;
    font-family:"MF Mono", monospace; font-size:11px; letter-spacing:.2em;
    color: rgba(233,238,245,.4);
    text-align:center;
  }
  .hint b{ color: rgba(255,176,46,.75); font-weight:700; }

  @media (prefers-reduced-motion: reduce){
    .neon-sign, .record, .broadcast-led.on::before{ animation:none; }
    .tonearm, .knob .cap, .pbtn{ transition:none; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="cabinet" id="cabinet">

      <!-- arched glass -->
      <div class="arch">
        <div class="neon-sign">MF&nbsp;RADIO</div>
        <div class="record-stage">
          <div class="record" id="record">
            <div class="label">
              <div class="label-copy"><b>MF</b><span class="record-track" id="recordTrack" aria-hidden="true">---</span></div>
            </div>
          </div>
          <div class="tonearm" id="tonearm">
            <div class="rod"></div><div class="head"></div><div class="pivot"></div>
          </div>
        </div>
      </div>

      <!-- track display -->
      <div class="marquee">
        <div class="led-row">
          <div class="digits" id="digits" role="status" aria-live="polite" aria-label="Track 000">
            <div class="digit dim" id="d0" aria-hidden="true">0</div>
            <div class="digit dim" id="d1" aria-hidden="true">0</div>
            <div class="digit dim" id="d2" aria-hidden="true">0</div>
          </div>
        </div>
      </div>

      <!-- control panel -->
      <div class="panel">
        <span class="screw tl"></span><span class="screw tr"></span>
        <span class="screw bl"></span><span class="screw br"></span>

        <div class="vu-box">
          <canvas id="vu" aria-hidden="true"></canvas>
          <div class="vu-label">FREQUENCY · SPECTRUM</div>
        </div>

        <div class="knob-col">
          <div class="knob-wrap">
            <span class="knob-scale min" aria-hidden="true">0</span>
            <span class="knob-scale mid" aria-hidden="true">5.5</span>
            <div class="knob" id="knob" role="slider" aria-label="volume, 0 to 11" aria-valuemin="0" aria-valuemax="11" aria-valuenow="9" tabindex="0">
              <div class="tick"></div><div class="cap"><div class="pointer"></div></div>
            </div>
            <span class="knob-scale max" aria-hidden="true">11</span>
          </div>
          <div class="knob-label">VOLUME</div>
          <div class="broadcast-led" id="statusLed" role="status" aria-live="polite" aria-label="Broadcast off">BROADCAST</div>
        </div>

        <div class="btn-row">
          <button class="pbtn" id="playBtn" type="button" title="Play / Pause  (Space)">
            <span class="glyph" id="playGlyph">▶</span><span id="playCaption">PLAY</span>
          </button>
          <button class="pbtn amber" id="nextBtn" type="button" title="Next song  (N)">
            <span class="glyph">⏭</span><span>NEXT</span>
          </button>
        </div>
      </div>

      <!-- speaker grille -->
      <div class="speaker" aria-hidden="true"></div>

    </div>
    <div class="hint"><b>←</b> pause &nbsp;·&nbsp; <b>→</b> play/next &nbsp;·&nbsp; <b>↑↓</b> volume</div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- track list ---------------- */
  var BASE = "assets/";
  var COUNT = 102;                                  // Motherfuckers_0.mp3 .. _101.mp3
  var fileOf = function(n){ return BASE + "Motherfuckers_" + n + ".mp3"; };

  /* ---------------- DOM ---------------- */
  var $ = function(id){ return document.getElementById(id); };
  var cabinet   = $("cabinet");
  var digitsDisplay = $("digits");
  var digits    = [$("d0"), $("d1"), $("d2")];
  var recordTrack = $("recordTrack");
  var statusLed = $("statusLed");
  var playBtn   = $("playBtn");
  var playGlyph = $("playGlyph");
  var playCaption = $("playCaption");
  var nextBtn   = $("nextBtn");
  var knob      = $("knob");
  var tonearm   = $("tonearm");
  var vu        = $("vu");
  var vuCtx     = vu.getContext("2d");

  /* ---------------- shuffle queue (no repeats until all played) ---------------- */
  var queue = [], qi = 0;
  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function refill(){
    queue = shuffle(Array.from({length:COUNT}, function(_,i){ return i; }));
    qi = 0;
  }
  function pick(exclude){
    if(qi >= queue.length) refill();
    var n = queue[qi++];
    if(n === exclude && COUNT > 1){ refill(); n = queue[qi++]; }
    return n;
  }

  /* ---------------- state ---------------- */
  var state = "idle";           // idle | playing | paused
  var volume = 0.8;
  var cur = null;               // { el, num, gain }
  var lastNum = null;
  var started = false;
  var ARM_OUTER = 0, ARM_INNER = 38;
  var TRACK_GAP = 650;
  var armResetTimer = 0;
  var trackChangeToken = 0;

  /* ---------------- audio engine ---------------- */
  var els = [new Audio(), new Audio()];
  var elIdx = 0;
  els.forEach(function(el){ el.preload = "auto"; el.setAttribute("playsinline", ""); });

  var AC = null, analyser = null, master = null, useWebAudio = false;
  var gains = [null, null];
  var fadeTokens = [0, 0];
  var freqData = null, spectrumBands = null;
  var wakeLock = null;
  var mobileLike = window.matchMedia("(pointer:coarse)").matches;

  function ensureAudio(){
    if(AC){
      if(AC.state === "suspended") AC.resume().catch(function(){});
      return;
    }
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      AC = new Ctx();
      analyser = AC.createAnalyser();
      analyser.fftSize = 2048;                    // 1024 frequency bins
      analyser.smoothingTimeConstant = 0.68;
      analyser.minDecibels = -90;
      analyser.maxDecibels = -10;
      master = AC.createGain();
      master.gain.value = volume;
      master.connect(analyser);
      analyser.connect(AC.destination);
      els.forEach(function(el, i){
        var src = AC.createMediaElementSource(el);
        gains[i] = AC.createGain();
        gains[i].gain.value = 0;
        src.connect(gains[i]);
        gains[i].connect(master);
      });
      useWebAudio = true;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      spectrumBands = buildSpectrumBands();
    }catch(e){
      useWebAudio = false;
      els.forEach(function(el){ el.volume = volume; });
    }
    if(AC && AC.state === "suspended") AC.resume().catch(function(){});
  }

  function buildSpectrumBands(){
    var ranges = [];
    var nyquist = AC.sampleRate / 2;
    var minFrequency = 45;
    var maxFrequency = Math.min(16000, nyquist * 0.92);
    var ratio = maxFrequency / minFrequency;
    for(var i = 0; i < 18; i++){
      var low = minFrequency * Math.pow(ratio, i / 18);
      var high = minFrequency * Math.pow(ratio, (i + 1) / 18);
      var from = Math.max(1, Math.floor(low / nyquist * analyser.frequencyBinCount));
      var to = Math.max(from + 1, Math.ceil(high / nyquist * analyser.frequencyBinCount));
      ranges.push([from, Math.min(analyser.frequencyBinCount, to)]);
    }
    return ranges;
  }

  function setVolume(v){
    volume = Math.min(1, Math.max(0, v));
    if(useWebAudio && master){
      master.gain.setTargetAtTime(volume, AC.currentTime, 0.03);
    }else{
      els.forEach(function(el){ el.volume = volume; });
    }
    knob.style.setProperty("--rot", knobAngle(volume) + "deg");
    knob.setAttribute("aria-valuenow", (volume * 11).toFixed(1).replace(".0", ""));
  }

  function fadeOutEl(el, i, ms){
    var token = ++fadeTokens[i];
    if(useWebAudio && gains[i]){
      gains[i].gain.cancelScheduledValues(AC.currentTime);
      gains[i].gain.setValueAtTime(gains[i].gain.value, AC.currentTime);
      gains[i].gain.setTargetAtTime(0, AC.currentTime, ms / 3000);
    }else{
      var from = el.volume, t0 = performance.now();
      (function step(){
        if(token !== fadeTokens[i]) return;
        var p = Math.min(1, (performance.now() - t0) / ms);
        el.volume = from * (1 - p);
        if(p < 1) requestAnimationFrame(step);
      })();
    }
  }

  function fadeInEl(el, i, ms){
    var token = ++fadeTokens[i];
    if(useWebAudio && gains[i]){
      gains[i].gain.cancelScheduledValues(AC.currentTime);
      gains[i].gain.setValueAtTime(0, AC.currentTime);
      gains[i].gain.setTargetAtTime(1, AC.currentTime, ms / 3000);
    }else{
      if(document.hidden){ el.volume = volume; return; }
      el.volume = 0;
      var t0 = performance.now();
      (function step(){
        if(token !== fadeTokens[i]) return;
        var p = Math.min(1, (performance.now() - t0) / ms);
        el.volume = p * volume;
        if(p < 1 && el.paused === false) requestAnimationFrame(step);
      })();
    }
  }

  /* ---------------- tonearm tracking ---------------- */
  function updateTonearm(){
    if(!cur || !tonearm.classList.contains("tracking")) return;
    var el = cur.el;
    var progress = Number.isFinite(el.duration) && el.duration > 0
      ? Math.min(1, Math.max(0, el.currentTime / el.duration))
      : 0;
    var angle = ARM_OUTER + (ARM_INNER - ARM_OUTER) * progress;
    tonearm.style.setProperty("--arm-rot", angle.toFixed(3) + "deg");
  }

  function resetTonearm(){
    clearTimeout(armResetTimer);
    tonearm.classList.remove("tracking");
    // Make the return to the outer groove visible before linear tracking resumes.
    void tonearm.offsetWidth;
    tonearm.style.setProperty("--arm-rot", ARM_OUTER + "deg");
    armResetTimer = setTimeout(function(){
      tonearm.classList.add("tracking");
      updateTonearm();
    }, 600);
  }

  function beginPlayback(track){
    if(cur !== track || !track.ready || state !== "playing") return;
    if(AC && AC.state === "suspended") AC.resume().catch(function(){});
    if(!track.started){
      fadeInEl(track.el, track.index, track.fadeMs);
      track.started = true;
    }
    var p = track.el.play();
    if(p && p.catch) p.catch(function(){ /* playback begins from a user gesture */ });
  }

  async function requestScreenAwake(){
    if(!mobileLike || state !== "playing" || document.hidden || wakeLock || !("wakeLock" in navigator)) return;
    try{
      var lock = await navigator.wakeLock.request("screen");
      wakeLock = lock;
      lock.addEventListener("release", function(){ if(wakeLock === lock) wakeLock = null; });
      if(state !== "playing" || document.hidden) lock.release().catch(function(){});
    }catch(e){ /* unsupported, denied, low battery or power-saving mode */ }
  }

  function releaseScreenAwake(){
    if(!wakeLock) return;
    var lock = wakeLock;
    wakeLock = null;
    lock.release().catch(function(){});
  }

  function updateMediaSession(num){
    if(!("mediaSession" in navigator)) return;
    if("MediaMetadata" in window){
      navigator.mediaSession.metadata = new MediaMetadata({
        title:"Track " + String(num).padStart(3, "0"),
        artist:"MF Radio",
        album:"MF Radio"
      });
    }
  }

  function playTrack(num, firstPlay){
    var i = elIdx; elIdx ^= 1;
    var el = els[i];
    var hadPrevious = !!cur;
    var changeToken = ++trackChangeToken;

    // fade out the previous one
    if(cur){
      var old = cur;
      if(document.hidden){
        ++fadeTokens[old.index];
        if(useWebAudio && gains[old.index]){
          gains[old.index].gain.cancelScheduledValues(AC.currentTime);
          gains[old.index].gain.setValueAtTime(0, AC.currentTime);
        }
        old.el.pause();
        old.el.removeAttribute("src");
        try{ old.el.load(); }catch(e){}
      }else{
        fadeOutEl(old.el, old.index, 260);
        setTimeout(function(){
          if(cur && cur.el === old.el) return;
          old.el.pause();
          old.el.removeAttribute("src");
          try{ old.el.load(); }catch(e){}
        }, 340);
      }
      lastNum = old.num;
    }

    el.src = fileOf(num);
    el.onloadedmetadata = function(){
      if(cur && cur.el === el) updateTonearm();
    };
    el.onended = function(){
      if(cur && cur.el === el && state === "playing") next();
    };
    el.onerror = function(){
      // skip missing/broken files after a short beat
      setTimeout(function(){
        if(cur && cur.el === el && state !== "idle") next();
      }, 600);
    };

    var track = {
      el: el, num: num, gain: gains[i], index: i,
      ready: !hadPrevious, started: false, fadeMs: firstPlay ? 400 : 650
    };
    cur = track;
    state = "playing";
    cabinet.classList.add("is-playing");
    resetTonearm();
    cabinet.classList.add("has-track");
    setUi(num);
    requestVU();
    if(hadPrevious){
      setTimeout(function(){
        if(changeToken !== trackChangeToken || cur !== track) return;
        track.ready = true;
        beginPlayback(track);
      }, document.hidden ? 0 : TRACK_GAP);
    }else{
      beginPlayback(track);
    }
  }

  /* ---------------- UI ---------------- */
  function setUi(num){
    var s = String(num).padStart(3, "0");
    digitsDisplay.setAttribute("aria-label", "Track " + s);
    recordTrack.textContent = s;
    updateMediaSession(num);
    digits.forEach(function(d, k){
      d.textContent = s[k];
      d.classList.remove("dim");
    });
  }
  function setStatus(){
    var broadcasting = state === "playing";
    statusLed.className = "broadcast-led" + (broadcasting ? " on" : "");
    statusLed.setAttribute("aria-label", broadcasting ? "Broadcast active" : "Broadcast off");
    if("mediaSession" in navigator) navigator.mediaSession.playbackState = broadcasting ? "playing" : (state === "paused" ? "paused" : "none");
    if(broadcasting) requestScreenAwake(); else releaseScreenAwake();
    if(state === "playing"){
      playGlyph.textContent = "❚❚"; playCaption.textContent = "PAUSE";
    }else{
      playGlyph.textContent = "▶"; playCaption.textContent = started ? "PLAY" : "READY";
    }
  }

  /* ---------------- actions ---------------- */
  function start(){
    if(started) return;
    started = true;
  }

  function next(){
    if(!started){ start(); ensureAudio(); }
    ensureAudio();
    var n = pick(cur ? cur.num : -1);
    playTrack(n, false);
  }

  playBtn.addEventListener("click", function(){
    if(state === "idle"){
      if(!started){ start(); ensureAudio(); }
      var n = pick(-1);
      playTrack(n, true);
      setStatus();
      return;
    }
    if(state === "playing"){
      if(cur.started) cur.el.pause();
      state = "paused";
      cabinet.classList.remove("is-playing");
      requestVU();
    }else if(state === "paused"){
      ensureAudio();
      state = "playing";
      cabinet.classList.add("is-playing");
      beginPlayback(cur);
      requestVU();
    }
    setStatus();
  });

  nextBtn.addEventListener("click", function(){
    next();
    setStatus();
  });

  /* keyboard */
  window.addEventListener("keydown", function(e){
    if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if(e.code === "Space"){ e.preventDefault(); playBtn.click(); }
    else if(e.key === "n" || e.key === "N"){ nextBtn.click(); }
    else if(e.key === "ArrowRight"){
      e.preventDefault();
      if(!e.repeat) (state === "playing" ? nextBtn : playBtn).click();
    }
    else if(e.key === "ArrowLeft"){
      e.preventDefault();
      if(!e.repeat && state === "playing") playBtn.click();
    }
    else if(e.key === "ArrowUp"){ e.preventDefault(); setVolume(volume + 0.05); }
    else if(e.key === "ArrowDown"){ e.preventDefault(); setVolume(volume - 0.05); }
  });

  /* ---------------- volume knob ---------------- */
  function knobAngle(v){
    // Symmetric endpoints keep 0 and 11 on the same horizontal level.
    return v <= 0.5 ? -130 + 260 * v : 260 * (v - 0.5);
  }
  function buildKnobScale(){
    var ring = knob.querySelector(".tick");
    for(var i = 0; i <= 22; i++){
      var mark = document.createElement("span");
      mark.className = "tick-mark" + (i % 2 === 0 || i === 11 ? " major" : "");
      mark.style.setProperty("--tick-rot", knobAngle(i / 22) + "deg");
      ring.appendChild(mark);
    }
  }
  var dragging = false, dragY = 0, dragV = 0;
  knob.addEventListener("pointerdown", function(e){
    dragging = true; dragY = e.clientY; dragV = volume;
    knob.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  knob.addEventListener("pointermove", function(e){
    if(!dragging) return;
    setVolume(dragV + (dragY - e.clientY) / 150);
  });
  knob.addEventListener("pointerup",   function(){ dragging = false; });
  knob.addEventListener("pointercancel",function(){ dragging = false; });
  knob.addEventListener("wheel", function(e){
    e.preventDefault();
    setVolume(volume + (e.deltaY < 0 ? 0.05 : -0.05));
  }, { passive:false });
  knob.addEventListener("keydown", function(e){
    if(e.key === "ArrowUp"){ e.preventDefault(); e.stopPropagation(); setVolume(volume + 0.05); }
    if(e.key === "ArrowDown"){ e.preventDefault(); e.stopPropagation(); setVolume(volume - 0.05); }
  });
  buildKnobScale();
  setVolume(volume);

  /* ---------------- real-time frequency spectrum ---------------- */
  var bars = 18, heights = new Array(bars).fill(0), vuFrame = 0;
  function requestVU(){
    if(!vuFrame && !document.hidden) vuFrame = requestAnimationFrame(drawVU);
  }
  function sizeVU(){
    var r = window.devicePixelRatio || 1;
    var w = vu.clientWidth, h = vu.clientHeight;
    if(vu.width !== w * r || vu.height !== h * r){
      vu.width = w * r; vu.height = h * r;
      vuCtx.setTransform(r, 0, 0, r, 0, 0);
    }
  }
  function drawVU(){
    vuFrame = 0;
    updateTonearm();
    sizeVU();
    var w = vu.clientWidth, h = vu.clientHeight;
    vuCtx.clearRect(0, 0, w, h);

    var active = state === "playing" && useWebAudio && spectrumBands;
    if(active && analyser){
      analyser.getByteFrequencyData(freqData);
    }

    var bw = w / bars;
    for(var i = 0; i < bars; i++){
      var goal = 0;
      if(active){
        var range = spectrumBands[i], energy = 0;
        for(var b = range[0]; b < range[1]; b++) energy += freqData[b] * freqData[b];
        var rms = Math.sqrt(energy / (range[1] - range[0])) / 255;
        // Compensate gently for the natural high-frequency roll-off, then add
        // a small analogue-style flutter without inventing spectral content.
        var compensation = 1 + 0.65 * (i / (bars - 1));
        var flutter = 0.92 + Math.random() * 0.16;
        goal = Math.min(1, Math.max(0, Math.pow(rms, 1.15) * compensation * 1.7 - 0.025) * flutter);
      }
      heights[i] += (goal - heights[i]) * (goal > heights[i] ? 0.52 : 0.16);
      var bh = Math.max(2, heights[i] * (h - 6));
      var x = i * bw + 2, y = h - 3 - bh;
      var t = heights[i];
      var color = t > 0.72 ? "#ff4040" : (t > 0.42 ? "#ff9a2e" : "#ffb02e");
      vuCtx.fillStyle = color;
      vuCtx.shadowColor = color;
      vuCtx.shadowBlur = 6;
      vuCtx.fillRect(x, y, bw - 4, bh);
      vuCtx.shadowBlur = 0;
    }
    // baseline
    vuCtx.fillStyle = "rgba(255,176,46,.25)";
    vuCtx.fillRect(2, h - 2, w - 4, 1);
    if(state === "playing" || heights.some(function(value){ return value > 0.01; })) requestVU();
  }
  requestVU();
  window.addEventListener("resize", function(){
    requestVU();
  });
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden){
      requestVU();
      if(state === "playing"){
        ensureAudio();
        requestScreenAwake();
      }
    }
  });

  if("mediaSession" in navigator){
    [["play", function(){ if(state !== "playing") playBtn.click(); }],
     ["pause", function(){ if(state === "playing") playBtn.click(); }],
     ["nexttrack", function(){ nextBtn.click(); }]].forEach(function(entry){
      try{ navigator.mediaSession.setActionHandler(entry[0], entry[1]); }catch(e){}
    });
  }

  setStatus();
})();
</script>
</body>
</html>
