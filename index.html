<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MF Radio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>" />
<style>
  :root{
    --wood-hi:#7a4a2a; --wood:#552f18; --wood-lo:#3a1e0e;
    --chrome-1:#f4f6f8; --chrome-2:#9aa4ad; --chrome-3:#5c666f;
    --neon:#ff4fd8; --neon-soft:rgba(255,79,216,.55);
    --led-amber:#ffb02e; --led-green:#3dff8b; --led-red:#ff4040;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(120% 90% at 50% 18%, #1b1322 0%, #0e0a14 45%, #060409 100%);
    color:#e9eef5;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 28px 14px 40px;
    overflow-x:hidden;
  }
  /* checkered floor */
  body::before{
    content:""; position:fixed; left:0; right:0; bottom:0; height:34vh; z-index:0;
    background:
      repeating-conic-gradient(#141019 0% 25%, #0a070d 0% 50%);
    background-size: 84px 84px;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent);
            mask-image: linear-gradient(to top, rgba(0,0,0,.9), transparent);
    pointer-events:none;
  }

  .scene{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }

  /* ================= CABINET ================= */
  .cabinet{
    position:relative;
    width:min(440px, 94vw);
    border-radius: 34px 34px 14px 14px / 90px 90px 14px 14px;
    background:
      repeating-linear-gradient(94deg,
        rgba(0,0,0,.16) 0 3px, rgba(255,255,255,.05) 3px 6px,
        rgba(0,0,0,.10) 6px 11px, rgba(0,0,0,.20) 11px 15px),
      linear-gradient(180deg, var(--wood-hi) 0%, var(--wood) 40%, var(--wood-lo) 100%);
    border: 3px solid #2a150a;
    box-shadow:
      0 0 0 3px #c7ccd2,
      0 0 0 6px #4d565e,
      0 30px 60px rgba(0,0,0,.75),
      0 0 90px rgba(255,79,216,.10);
    padding: 18px 18px 14px;
    filter: drop-shadow(0 0 34px rgba(255,79,216,.12));
  }
  /* floor shadow */
  .cabinet::after{
    content:""; position:absolute; left:8%; right:8%; bottom:-26px; height:34px;
    background: radial-gradient(50% 100% at 50% 0%, rgba(0,0,0,.7), transparent 70%);
    z-index:-1;
  }

  /* ================= ARCHED GLASS ================= */
  .arch{
    position:relative;
    border-radius: 50% 50% 12px 12px / 78% 78% 12px 12px;
    overflow:hidden;
    background:
      radial-gradient(90% 55% at 50% 0%, rgba(255,190,110,.30), transparent 60%),
      radial-gradient(120% 90% at 50% 30%, #171020 0%, #0b0712 55%, #060309 100%);
    border: 4px solid;
    border-color: var(--chrome-1) var(--chrome-3) var(--chrome-2) var(--chrome-1);
    box-shadow: inset 0 0 34px rgba(0,0,0,.9), 0 2px 0 rgba(255,255,255,.15);
    padding: 26px 16px 18px;
  }
  /* warm spotlight sweep */
  .arch::before{
    content:""; position:absolute; inset:0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.07) 46%, rgba(255,255,255,.02) 54%, transparent 70%);
    pointer-events:none;
  }

  .neon-sign{
    text-align:center;
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    font-size: clamp(34px, 11vw, 46px);
    letter-spacing: .14em;
    color:#fff0fb;
    text-shadow:
      0 0 6px  #fff,
      0 0 14px var(--neon),
      0 0 30px var(--neon),
      0 0 60px var(--neon-soft),
      0 0 90px var(--neon-soft);
    user-select:none;
    animation: neonFlicker 6s infinite;
    margin-bottom: 14px;
  }
  @keyframes neonFlicker{
    0%,100%{ opacity:1; } 92%{ opacity:1; } 93%{ opacity:.55; } 94%{ opacity:1; }
    96%{ opacity:.75; } 97%{ opacity:1; }
  }

  /* ---------- record + tonearm ---------- */
  .record-stage{
    position:relative;
    width:76%; margin: 4px auto 0;
    aspect-ratio: 1/1;
  }
  .record{
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 34% 30%, rgba(255,255,255,.16), transparent 42%),
      repeating-radial-gradient(circle at 50% 50%,
        #0d0d10 0 2px, #17171c 2px 4px, #0d0d10 4px 6px);
    box-shadow: 0 0 34px rgba(0,0,0,.85), inset 0 0 44px rgba(0,0,0,.9);
    animation: spin 1.8s linear infinite;
    animation-play-state: paused;
  }
  .cabinet.is-playing .record{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .record .label{
    position:absolute; inset:33%; border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 45%),
      linear-gradient(160deg, #ff5fd0 0%, #b0147f 55%, #6d0b4c 100%);
    box-shadow: inset 0 0 12px rgba(0,0,0,.55), 0 0 0 3px #1a0a12;
    display:flex; align-items:center; justify-content:center;
  }
  .record .label b{
    font-family: Impact, "Arial Narrow Bold", sans-serif;
    font-size: clamp(16px, 5vw, 22px);
    letter-spacing:.12em; color:#fff3fa;
    text-shadow: 0 0 8px rgba(255,255,255,.8);
    transform: translateY(-14%);
  }
  .record .label::after{
    content:""; position:absolute; left:50%; top:50%; width:9%; height:9%;
    transform:translate(-50%,-50%); border-radius:50%;
    background:#0b0709; box-shadow: 0 0 0 2px #3d2a33;
  }

  .tonearm{
    position:absolute; top:4%; right:2%;
    width:14%; height:14%;
    transform-origin: 50% 50%;
    transform: rotate(-24deg);
    transition: transform 1.1s cubic-bezier(.6,-0.2,.3,1.3);
    z-index:3;
    pointer-events:none;
  }
  .cabinet.has-track .tonearm{ transform: rotate(38deg); }
  .tonearm .pivot{
    position:absolute; inset:0; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--chrome-1), var(--chrome-2) 55%, var(--chrome-3));
    box-shadow: 0 2px 6px rgba(0,0,0,.6), inset 0 -2px 4px rgba(0,0,0,.4);
  }
  .tonearm .rod{
    position:absolute; left:50%; top:50%;
    width:5px; height:310%;
    transform: translate(-50%,0);
    border-radius:4px;
    background: linear-gradient(90deg, var(--chrome-3), var(--chrome-1) 45%, var(--chrome-2));
    box-shadow: 0 0 6px rgba(0,0,0,.5);
  }
  .tonearm .head{
    position:absolute; left:50%; top:308%;
    width:15px; height:24px; transform: translate(-50%,0) rotate(18deg);
    border-radius: 4px 4px 7px 7px;
    background: linear-gradient(160deg, var(--chrome-1), var(--chrome-3));
    box-shadow: 0 2px 5px rgba(0,0,0,.6);
  }

  /* ================= MARQUEE / LED ================= */
  .marquee{
    margin-top: 16px;
    border-radius: 12px;
    background: linear-gradient(180deg, #050505, #101010 60%, #070707);
    border: 3px solid;
    border-color: var(--chrome-2) var(--chrome-3) var(--chrome-1) var(--chrome-2);
    box-shadow: inset 0 2px 14px rgba(0,0,0,.95);
    padding: 10px 12px 12px;
  }
  .led-track{
    height: 40px; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(90deg, rgba(255,176,46,.05) 0 2px, transparent 2px 5px),
      #0a0602;
    border-radius: 8px;
    border: 1px solid #241708;
    box-shadow: inset 0 0 18px rgba(0,0,0,.9), inset 0 0 8px rgba(255,176,46,.08);
    --scroll-w: 0px; --wrap-w: 0px;
  }
  .led-track .inner{
    white-space: nowrap;
    font-family: "Courier New", ui-monospace, monospace;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: .18em;
    color: var(--led-amber);
    text-shadow: 0 0 6px rgba(255,176,46,.9), 0 0 18px rgba(255,120,20,.5);
  }
  .led-track.scrolling .inner{
    animation: marquee var(--speed,9s) linear infinite;
  }
  @keyframes marquee{
    from{ transform: translateX(0); }
    to{ transform: translateX(calc(var(--scroll-w) * -1 - var(--wrap-w))); }
  }
  .led-row{
    margin-top: 9px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .digits{ display:flex; gap:4px; }
  .digit{
    width:26px; height:34px; display:flex; align-items:center; justify-content:center;
    background:#0a0602; border:1px solid #241708; border-radius:5px;
    font-family:"Courier New", monospace; font-weight:700; font-size:22px;
    color:var(--led-amber);
    text-shadow: 0 0 6px rgba(255,176,46,.9), 0 0 16px rgba(255,120,20,.5);
    box-shadow: inset 0 0 10px rgba(0,0,0,.9);
  }
  .digit.dim{ color:rgba(255,176,46,.18); text-shadow:none; }
  .status-led{
    font-family:"Courier New", monospace; font-weight:700; font-size:12px;
    letter-spacing:.14em; color:var(--led-green);
    text-shadow: 0 0 8px rgba(61,255,139,.8);
    display:flex; align-items:center; gap:7px;
  }
  .status-led::before{
    content:""; width:9px; height:9px; border-radius:50%;
    background: var(--led-green);
    box-shadow: 0 0 8px var(--led-green), 0 0 16px rgba(61,255,139,.6);
  }
  .status-led.standby{ color:rgba(255,176,46,.25); text-shadow:none; }
  .status-led.standby::before{ background:#3a2b12; box-shadow:none; }
  .status-led.paused{ color:var(--led-amber); text-shadow:0 0 8px rgba(255,176,46,.8); }
  .status-led.paused::before{ background:var(--led-amber); box-shadow:0 0 8px rgba(255,176,46,.7); animation: blink 1s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }

  /* ================= CONTROL PANEL ================= */
  .panel{
    position:relative;
    margin-top: 14px;
    border-radius: 12px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px),
      linear-gradient(180deg, #d7dde2, #aab3ba 45%, #8b959d);
    border: 2px solid #525c64;
    box-shadow: inset 0 2px 3px rgba(255,255,255,.7), inset 0 -6px 12px rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.4);
    padding: 14px 14px 16px;
    display:grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 12px 14px;
    align-items:center;
  }
  .screw{
    position:absolute; width:11px; height:11px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f2f5f7, #7b848c 60%, #4a525a);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,.5);
  }
  .screw::after{
    content:""; position:absolute; left:15%; right:15%; top:46%; height:1.5px;
    background:#3a424a; transform: rotate(38deg);
  }
  .screw.tl{ top:6px; left:6px; } .screw.tr{ top:6px; right:6px; }
  .screw.bl{ bottom:6px; left:6px; } .screw.br{ bottom:6px; right:6px; }

  .vu-box{
    grid-column:1 / 2; grid-row:1 / 2;
    background:#071007;
    border-radius:8px; border:2px solid #4a525a;
    box-shadow: inset 0 0 12px rgba(0,0,0,.9);
    padding:6px 8px 4px;
  }
  .vu-box canvas{ display:block; width:100%; height:42px; }
  .vu-box .vu-label{
    font-family:"Courier New", monospace; font-size:9px; font-weight:700;
    letter-spacing:.3em; color:#5f7a68; text-align:center; margin-top:2px;
  }

  .knob-col{
    grid-column:2 / 3; grid-row:1 / 3;
    display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .knob{
    --rot:-135deg;
    position:relative; width:74px; height:74px; border-radius:50%;
    background:
      radial-gradient(circle at 32% 28%, #fff, #cfd6db 30%, #8f99a1 62%, #59636b);
    border:2px solid #39424a;
    box-shadow: 0 5px 12px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.8), inset 0 -6px 10px rgba(0,0,0,.35);
    cursor: ns-resize; touch-action:none;
    user-select:none;
  }
  .knob .cap{
    position:absolute; inset:9px; border-radius:50%;
    background:
      conic-gradient(from 0deg, #6a747c, #cdd5da 25%, #6a747c 50%, #cdd5da 75%, #6a747c);
    box-shadow: inset 0 2px 4px rgba(255,255,255,.6), inset 0 -4px 8px rgba(0,0,0,.4);
    transform: rotate(var(--rot));
    transition: transform .08s linear;
  }
  .knob .pointer{
    position:absolute; left:50%; top:5px; width:4px; height:16px;
    transform: translateX(-50%);
    border-radius:3px; background:#202830;
    box-shadow: 0 0 3px rgba(0,0,0,.5);
  }
  .knob .tick{
    position:absolute; inset:-7px; border-radius:50%;
    background:
      repeating-conic-gradient(from -135deg, rgba(0,0,0,.55) 0deg 2deg, transparent 2deg 36deg);
    -webkit-mask: radial-gradient(circle, transparent 62%, #000 63% 71%, transparent 72%);
            mask: radial-gradient(circle, transparent 62%, #000 63% 71%, transparent 72%);
    pointer-events:none;
  }
  .knob-label{
    font-family:"Courier New", monospace; font-size:9px; font-weight:700;
    letter-spacing:.28em; color:#39424a;
  }

  .btn-row{
    grid-column:1 / 2; grid-row:2 / 3;
    display:flex; gap:14px; align-items:center; justify-content:center;
  }
  .pbtn{
    --btn-hi:#fff; --btn-mid:#d94b4b; --btn-lo:#8c1616;
    position:relative;
    width:64px; height:64px; border-radius:50%;
    border:2px solid #2c3339;
    background: radial-gradient(circle at 32% 28%, var(--btn-hi), var(--btn-mid) 42%, var(--btn-lo) 78%, #5e0d0d);
    box-shadow: 0 6px 12px rgba(0,0,0,.55), inset 0 2px 3px rgba(255,255,255,.7), inset 0 -8px 12px rgba(0,0,0,.45);
    color:#fff; cursor:pointer;
    font-family:"Courier New", monospace; font-weight:700; font-size:11px; letter-spacing:.1em;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    transition: transform .05s ease, box-shadow .05s ease;
  }
  .pbtn .glyph{ font-size:20px; line-height:1; text-shadow:0 1px 2px rgba(0,0,0,.5); }
  .pbtn:active{ transform: translateY(3px); box-shadow: 0 2px 5px rgba(0,0,0,.5), inset 0 2px 3px rgba(255,255,255,.6); }
  .pbtn.amber{ --btn-mid:#e8a52e; --btn-lo:#8a5a0d; --btn-hi:#ffe9c0; }

  /* ================= COIN DOOR ================= */
  .coin-door{
    margin-top: 14px;
    border-radius: 12px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, #2b241a, #1d1811 60%, #141009);
    border: 2px solid #0c0906;
    box-shadow: inset 0 2px 10px rgba(0,0,0,.8), inset 0 0 30px rgba(255,176,46,.04);
    padding: 12px 14px;
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .coin-slot{
    width:6px; height:44px; border-radius:4px;
    background: linear-gradient(90deg,#000,#1c1c1c 50%,#000);
    box-shadow: inset 0 0 6px #000, 0 0 0 3px #3c342a, 0 0 0 5px #17130d;
    transform: rotate(90deg); width:44px; height:6px;
  }
  .coin-btn{
    font-family:"Courier New", monospace; font-weight:700; font-size:13px; letter-spacing:.16em;
    color: var(--led-amber);
    background: radial-gradient(ellipse at 50% 30%, rgba(255,176,46,.16), rgba(255,176,46,.04) 70%), #120d06;
    border:1px solid rgba(255,176,46,.4);
    border-radius: 999px;
    padding: 13px 22px;
    cursor:pointer;
    text-shadow: 0 0 10px rgba(255,176,46,.9);
    box-shadow: 0 0 22px rgba(255,176,46,.15), inset 0 0 14px rgba(255,176,46,.08);
    animation: coinPulse 1.8s ease-in-out infinite;
    transition: transform .08s ease;
  }
  .coin-btn:hover{ background: radial-gradient(ellipse at 50% 30%, rgba(255,176,46,.28), rgba(255,176,46,.08) 70%), #120d06; }
  .coin-btn:active{ transform: scale(.97); }
  .coin-btn.lit{
    color: var(--led-green); border-color: rgba(61,255,139,.5);
    text-shadow: 0 0 10px rgba(61,255,139,.9);
    box-shadow: 0 0 22px rgba(61,255,139,.2), inset 0 0 14px rgba(61,255,139,.1);
    animation:none; cursor:default;
  }
  @keyframes coinPulse{ 0%,100%{ box-shadow: 0 0 10px rgba(255,176,46,.1), inset 0 0 10px rgba(255,176,46,.05); }
    50%{ box-shadow: 0 0 30px rgba(255,176,46,.3), inset 0 0 18px rgba(255,176,46,.12); } }

  .hint{
    margin-top: 18px;
    font-family:"Courier New", monospace; font-size:11px; letter-spacing:.2em;
    color: rgba(233,238,245,.4);
    text-align:center;
  }
  .hint b{ color: rgba(255,176,46,.75); font-weight:700; }
</style>
</head>
<body>
  <div class="scene">
    <div class="cabinet" id="cabinet">

      <!-- arched glass -->
      <div class="arch">
        <div class="neon-sign">MF&nbsp;RADIO</div>
        <div class="record-stage">
          <div class="record" id="record">
            <div class="label"><b>MF</b></div>
          </div>
          <div class="tonearm">
            <div class="rod"></div><div class="head"></div><div class="pivot"></div>
          </div>
        </div>
      </div>

      <!-- LED marquee -->
      <div class="marquee">
        <div class="led-track" id="trackLed">
          <div class="inner" id="trackInner">★ WELCOME TO MF RADIO ★</div>
        </div>
        <div class="led-row">
          <div class="digits" aria-label="track number">
            <div class="digit dim" id="d0">0</div>
            <div class="digit dim" id="d1">0</div>
            <div class="digit dim" id="d2">0</div>
          </div>
          <div class="status-led standby" id="statusLed">STANDBY</div>
        </div>
      </div>

      <!-- control panel -->
      <div class="panel">
        <span class="screw tl"></span><span class="screw tr"></span>
        <span class="screw bl"></span><span class="screw br"></span>

        <div class="vu-box">
          <canvas id="vu"></canvas>
          <div class="vu-label">SIGNAL · VU</div>
        </div>

        <div class="knob-col">
          <div class="knob" id="knob" role="slider" aria-label="volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
            <div class="tick"></div><div class="cap"></div><div class="pointer"></div>
          </div>
          <div class="knob-label">VOLUME</div>
        </div>

        <div class="btn-row">
          <button class="pbtn" id="playBtn" title="Play / Pause  (Space)">
            <span class="glyph" id="playGlyph">▶</span><span id="playCaption">PLAY</span>
          </button>
          <button class="pbtn amber" id="nextBtn" title="Next song  (N)">
            <span class="glyph">⏭</span><span>NEXT</span>
          </button>
        </div>
      </div>

      <!-- coin door -->
      <div class="coin-door">
        <div class="coin-slot"></div>
        <button class="coin-btn" id="coinBtn">INSERT COIN · START</button>
      </div>

    </div>
    <div class="hint"><b>SPACE</b> play/pause &nbsp;·&nbsp; <b>N</b> next song &nbsp;·&nbsp; <b>↑↓</b> volume</div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------------- track list ---------------- */
  var BASE = "assets/";
  var COUNT = 102;                                  // Motherfuckers_0.mp3 .. _101.mp3
  var fileOf = function(n){ return BASE + "Motherfuckers_" + n + ".mp3"; };
  var labelOf = function(n){
    return "★  MOTHERFUCKERS · Nº " + String(n).padStart(3,"0") + "  ★";
  };

  /* ---------------- DOM ---------------- */
  var $ = function(id){ return document.getElementById(id); };
  var cabinet   = $("cabinet");
  var trackLed  = $("trackLed");
  var trackIn   = $("trackInner");
  var digits    = [$("d0"), $("d1"), $("d2")];
  var statusLed = $("statusLed");
  var playBtn   = $("playBtn");
  var playGlyph = $("playGlyph");
  var playCaption = $("playCaption");
  var nextBtn   = $("nextBtn");
  var coinBtn   = $("coinBtn");
  var knob      = $("knob");
  var vu        = $("vu");
  var vuCtx     = vu.getContext("2d");

  /* ---------------- shuffle queue (no repeats until all played) ---------------- */
  var queue = [], qi = 0;
  function shuffle(arr){
    for(var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
  function refill(){
    queue = shuffle(Array.from({length:COUNT}, function(_,i){ return i; }));
    qi = 0;
  }
  function pick(exclude){
    if(qi >= queue.length) refill();
    var n = queue[qi++];
    if(n === exclude && COUNT > 1){ refill(); n = queue[qi++]; }
    return n;
  }

  /* ---------------- state ---------------- */
  var state = "idle";           // idle | playing | paused
  var volume = 0.8;
  var cur = null;               // { el, num, gain }
  var lastNum = null;
  var started = false;

  /* ---------------- audio engine ---------------- */
  var els = [new Audio(), new Audio()];
  var elIdx = 0;
  els.forEach(function(el){ el.preload = "auto"; });

  var AC = null, analyser = null, master = null, useWebAudio = false;
  var gains = [null, null];
  var freqData = null;

  function ensureAudio(){
    if(AC){ if(AC.state === "suspended") AC.resume(); return; }
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      AC = new Ctx();
      analyser = AC.createAnalyser();
      analyser.fftSize = 64;                       // 32 bins
      analyser.smoothingTimeConstant = 0.72;
      master = AC.createGain();
      master.gain.value = volume;
      master.connect(analyser);
      analyser.connect(AC.destination);
      els.forEach(function(el, i){
        var src = AC.createMediaElementSource(el);
        gains[i] = AC.createGain();
        gains[i].gain.value = 0;
        src.connect(gains[i]);
        gains[i].connect(master);
      });
      useWebAudio = true;
      freqData = new Uint8Array(analyser.frequencyBinCount);
    }catch(e){
      useWebAudio = false;
      els.forEach(function(el){ el.volume = volume; });
    }
    if(AC && AC.state === "suspended") AC.resume();
  }

  function setVolume(v){
    volume = Math.min(1, Math.max(0, v));
    if(useWebAudio && master){
      master.gain.setTargetAtTime(volume, AC.currentTime, 0.03);
    }else{
      els.forEach(function(el){ el.volume = volume; });
    }
    knob.style.setProperty("--rot", (-135 + 270 * volume) + "deg");
    knob.setAttribute("aria-valuenow", Math.round(volume * 100));
  }

  function fadeOutEl(el, i, ms){
    if(useWebAudio && gains[i]){
      gains[i].gain.setTargetAtTime(0, AC.currentTime, ms / 3000);
    }else{
      var from = el.volume, t0 = performance.now();
      (function step(){
        var p = Math.min(1, (performance.now() - t0) / ms);
        el.volume = from * (1 - p) * volume;
        if(p < 1) requestAnimationFrame(step);
      })();
    }
  }

  function fadeInEl(el, i, ms){
    if(useWebAudio && gains[i]){
      gains[i].gain.cancelScheduledValues(AC.currentTime);
      gains[i].gain.setValueAtTime(0, AC.currentTime);
      gains[i].gain.setTargetAtTime(1, AC.currentTime, ms / 3000);
    }else{
      el.volume = 0;
      var t0 = performance.now();
      (function step(){
        var p = Math.min(1, (performance.now() - t0) / ms);
        el.volume = p * volume;
        if(p < 1 && el.paused === false) requestAnimationFrame(step);
      })();
    }
  }

  function playTrack(num, firstPlay){
    var i = elIdx; elIdx ^= 1;
    var el = els[i];

    // fade out the previous one
    if(cur){
      var old = cur;
      fadeOutEl(old.el, i ^ 1, 700);
      setTimeout(function(){
        old.el.pause();
        old.el.removeAttribute("src");
        try{ old.el.load(); }catch(e){}
      }, 900);
      lastNum = old.num;
    }

    el.src = fileOf(num);
    el.onended = function(){
      if(cur && cur.el === el && state === "playing") next();
    };
    el.onerror = function(){
      // skip missing/broken files after a short beat
      setTimeout(function(){
        if(cur && cur.el === el && state !== "idle") next();
      }, 600);
    };

    fadeInEl(el, i, firstPlay ? 400 : 700);
    var p = el.play();
    if(p && p.catch) p.catch(function(){ /* needs user gesture – coin/start handles it */ });

    cur = { el: el, num: num, gain: gains[i] };
    state = "playing";
    cabinet.classList.add("is-playing");
    cabinet.classList.add("has-track");
    setUi(num);
  }

  /* ---------------- UI ---------------- */
  function setUi(num){
    trackIn.textContent = labelOf(num);
    requestAnimationFrame(function(){
      var sw = trackIn.scrollWidth, ww = trackLed.clientWidth;
      if(sw > ww + 20 && trackIn.textContent.length){
        trackLed.style.setProperty("--scroll-w", sw + "px");
        trackLed.style.setProperty("--wrap-w", ww + "px");
        trackLed.style.setProperty("--speed", Math.max(6, sw / 60) + "s");
        trackLed.classList.add("scrolling");
      }else{
        trackLed.classList.remove("scrolling");
      }
    });
    var s = String(num).padStart(3, "0");
    digits.forEach(function(d, k){
      d.textContent = s[k];
      d.classList.remove("dim");
    });
  }
  function setStatus(){
    if(state === "playing"){
      statusLed.className = "status-led"; statusLed.textContent = "PLAYING";
    }else if(state === "paused"){
      statusLed.className = "status-led paused"; statusLed.textContent = "PAUSED";
    }else{
      statusLed.className = "status-led standby"; statusLed.textContent = "STANDBY";
    }
    if(state === "playing"){
      playGlyph.textContent = "❚❚"; playCaption.textContent = "PAUSE";
    }else{
      playGlyph.textContent = "▶"; playCaption.textContent = started ? "PLAY" : "READY";
    }
  }

  /* ---------------- actions ---------------- */
  function start(){
    if(started) return;
    started = true;
    coinBtn.classList.add("lit");
    coinBtn.textContent = "★ 1 FREE PLAY ★";
  }

  function next(){
    if(!started){ start(); ensureAudio(); }
    ensureAudio();
    var n = pick(cur ? cur.num : -1);
    playTrack(n, false);
  }

  coinBtn.addEventListener("click", function(){
    if(started) return;
    start();
    ensureAudio();
    var n = pick(-1);
    playTrack(n, true);
    setStatus();
  });

  playBtn.addEventListener("click", function(){
    if(state === "idle"){
      if(!started){ start(); ensureAudio(); }
      var n = pick(-1);
      playTrack(n, true);
      setStatus();
      return;
    }
    if(state === "playing"){
      cur.el.pause();
      state = "paused";
      cabinet.classList.remove("is-playing");
    }else if(state === "paused"){
      ensureAudio();
      cur.el.play().catch(function(){});
      state = "playing";
      cabinet.classList.add("is-playing");
    }
    setStatus();
  });

  nextBtn.addEventListener("click", function(){
    next();
    setStatus();
  });

  /* keyboard */
  window.addEventListener("keydown", function(e){
    if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    if(e.code === "Space"){ e.preventDefault(); playBtn.click(); }
    else if(e.key === "n" || e.key === "N"){ nextBtn.click(); }
    else if(e.key === "ArrowUp" || e.key === "ArrowRight"){ e.preventDefault(); setVolume(volume + 0.05); }
    else if(e.key === "ArrowDown" || e.key === "ArrowLeft"){ e.preventDefault(); setVolume(volume - 0.05); }
  });

  /* ---------------- volume knob ---------------- */
  var dragging = false, dragY = 0, dragV = 0;
  knob.addEventListener("pointerdown", function(e){
    dragging = true; dragY = e.clientY; dragV = volume;
    knob.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  knob.addEventListener("pointermove", function(e){
    if(!dragging) return;
    setVolume(dragV + (dragY - e.clientY) / 150);
  });
  knob.addEventListener("pointerup",   function(){ dragging = false; });
  knob.addEventListener("pointercancel",function(){ dragging = false; });
  knob.addEventListener("wheel", function(e){
    e.preventDefault();
    setVolume(volume + (e.deltaY < 0 ? 0.05 : -0.05));
  }, { passive:false });
  knob.addEventListener("keydown", function(e){
    if(e.key === "ArrowUp" || e.key === "ArrowRight"){ e.preventDefault(); e.stopPropagation(); setVolume(volume + 0.05); }
    if(e.key === "ArrowDown" || e.key === "ArrowLeft"){ e.preventDefault(); e.stopPropagation(); setVolume(volume - 0.05); }
  });
  setVolume(volume);

  /* ---------------- VU meter ---------------- */
  var bars = 18, heights = new Array(bars).fill(0);
  function sizeVU(){
    var r = window.devicePixelRatio || 1;
    var w = vu.clientWidth, h = vu.clientHeight;
    if(vu.width !== w * r || vu.height !== h * r){
      vu.width = w * r; vu.height = h * r;
      vuCtx.setTransform(r, 0, 0, r, 0, 0);
    }
  }
  function drawVU(){
    requestAnimationFrame(drawVU);
    sizeVU();
    var w = vu.clientWidth, h = vu.clientHeight;
    vuCtx.clearRect(0, 0, w, h);

    var target = state === "playing" && useWebAudio ? 1 : 0;
    var live = 0;
    if(target && analyser){
      analyser.getByteFrequencyData(freqData);
      // energy across the lower bins
      var sum = 0;
      for(var b = 1; b < 9; b++) sum += freqData[b];
      live = Math.min(1, (sum / (8 * 200)));
    }

    var bw = w / bars;
    for(var i = 0; i < bars; i++){
      // pseudo-spectrum: high bars in the middle, live level modulated
      var shape = Math.sin((i / (bars - 1)) * Math.PI);
      var goal = target ? Math.max(0, live * (0.35 + 0.75 * shape) - Math.random() * 0.08) : 0;
      heights[i] += (goal - heights[i]) * (goal > heights[i] ? 0.5 : 0.18);
      var bh = Math.max(2, heights[i] * (h - 6));
      var x = i * bw + 2, y = h - 3 - bh;
      var t = heights[i];
      var color = t > 0.78 ? "#ff4040" : (t > 0.5 ? "#ff9a2e" : "#ffb02e");
      vuCtx.fillStyle = color;
      vuCtx.shadowColor = color;
      vuCtx.shadowBlur = 6;
      vuCtx.fillRect(x, y, bw - 4, bh);
      vuCtx.shadowBlur = 0;
    }
    // baseline
    vuCtx.fillStyle = "rgba(255,176,46,.25)";
    vuCtx.fillRect(2, h - 2, w - 4, 1);
  }
  drawVU();
  window.addEventListener("resize", function(){
    if(trackLed.classList.contains("scrolling")) setUi(cur ? cur.num : 0);
  });

  setStatus();
})();
</script>
</body>
</html>
